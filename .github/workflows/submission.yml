# Accept a submitted map, a withdrawal, or a vote - with nobody in the loop.
#
# ---------------------------------------------------------------------------
# THE WORKFLOW IS THE ONLY THING THAT EVER WRITES TO main
# ---------------------------------------------------------------------------
#
# The pull request is a PROPOSAL, not a merge. Nothing from it is merged; the
# workflow checks it, then writes the accepted end state to main itself and
# closes the pull request. So main only ever contains bytes this workflow put
# there, and "what was reviewed" and "what landed" cannot drift apart.
#
# That is also what makes the two fields a submitter must never control -
# `submitter` (ownership) and the vote tally - safe: they are stamped here,
# after the check, on the way to main.
#
# WHY pull_request_target, AND WHY IT IS NOT THE USUAL MISTAKE. A fork's
# `pull_request` run gets a read-only token, so it could check but never write,
# which defeats the point. `pull_request_target` gets a write token, and the
# classic way to get that wrong is to check out the fork's code and RUN it.
# This never runs anything from the submission:
#
#   * the validator and every script come from THIS repository's base branch -
#     a submission that could replace the validator would only have to submit
#     one that says yes;
#   * from the fork it takes DATA FILES ONLY, by explicit path;
#   * and check_submission.py refuses any diff touching anything else, so a
#     submission cannot even add a file a LATER workflow might run.

name: submission

on:
  pull_request_target:
    paths:
      - 'index.json'
      - 'maps/**'
      - 'votes/**'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: submission            # one writer to main at a time, ever
  cancel-in-progress: false

jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - name: check out this repository (not the submission)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: build the validator from OUR sources
        run: |
          g++ -O2 -Wall -o /tmp/validate tools/validate_cli.cpp -Itools
          test -f kit_paths.txt
          cp tools/check_submission.py tools/apply_submission.py /tmp/

      - name: take the submission's data files, and nothing else
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
          HEAD_SHA:  ${{ github.event.pull_request.head.sha }}
          BASE_SHA:  ${{ github.event.pull_request.base.sha }}
        run: |
          git remote add submitter "$HEAD_REPO"
          git fetch --no-tags --depth=50 submitter "$HEAD_SHA"
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" \
               | grep -vE '^(index\.json|maps/|votes/)' ; then
            echo "::error::a submission may only touch index.json, maps/ and votes/"
            exit 1
          fi
          git checkout "$HEAD_SHA" -- index.json 2>/dev/null || true
          git checkout "$HEAD_SHA" -- maps       2>/dev/null || true
          git checkout "$HEAD_SHA" -- votes      2>/dev/null || true
          # A deletion is not carried by `git checkout -- path`, so apply the
          # removals explicitly rather than silently ignoring them.
          git diff --name-status "$BASE_SHA...$HEAD_SHA" \
            | awk '$1=="D"{print $2}' | while read -r f; do rm -f "$f"; done
          find maps votes -type d -empty -delete 2>/dev/null || true

      - name: work out who is asking
        id: who
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          HEAD_REF:  ${{ github.event.pull_request.head.ref }}
          LOGIN:     ${{ github.event.pull_request.user.login }}
        run: |
          WHO="$LOGIN"
          if [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            # A branch in THIS repository can only have been pushed by the
            # Worker's token, so the identity it wrote into the name is as
            # trustworthy as the Worker. A fork cannot push a branch here, so
            # this can never be reached by a submission from outside.
            WHO=$(printf '%s' "$HEAD_REF" | sed -n 's/^\(k[0-9a-f]\{32\}\)-.*$/\1/p')
            if [ -z "$WHO" ]; then
              echo "::error::a branch here is named k<32 hex>-<kind>-<stamp>"
              exit 1
            fi
          fi
          echo "who=$WHO" >> "$GITHUB_OUTPUT"
          echo "this submission is from $WHO"

      - name: check it
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          WHO:      ${{ steps.who.outputs.who }}
        run: python3 /tmp/check_submission.py "$BASE_SHA" /tmp/validate kit_paths.txt "$WHO"

      - name: stamp the owner, recount the votes, and write it to main
        env:
          WHO: ${{ steps.who.outputs.who }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python3 /tmp/apply_submission.py "$WHO"
          git config user.name  "omd2forever-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A index.json maps votes
          if git diff --cached --quiet; then
            echo "nothing to write"
          else
            git commit -m "submission from $WHO (#$PR)"
            git push origin HEAD:main
          fi
          gh pr comment "$PR" --body "Accepted and published. Nothing of this
            branch was merged - the check passed and the result was written to
            main directly, which is why the tally and the submitter field are
            not yours to set."
          gh pr close "$PR" --delete-branch || gh pr close "$PR"

      - name: say why not
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "This submission was not accepted. The log
            above names the rule it broke. Nothing personal and nothing manual -
            the same check runs on everything, and the game runs the same
            validator again before it installs anything."
